name: build-windows

# 触发方式：
#  1) 推送以 v 开头的 tag（例如 v0.2.2）——自动用该 tag 建/更新 GitHub Release。
#  2) 在 Actions 页面手动触发（workflow_dispatch）——可在输入框填一个 Release tag；
#     留空则只构建、不发 Release（产物会作为构建 artifact 保留）。
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要创建 / 更新的 Release tag（手动触发时填写；tag 推送触发可留空）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 创建 / 更新 GitHub Release 需要写权限

jobs:
  build-windows:
    name: 构建 Windows 安装包（NSIS）
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ── 更新签名（自动更新用）────────────────────────────────────
      # 私钥来自本仓库 Secrets，绝不入库。私钥在 ~/.tauri/jianlu.key，
      # 密码在 ~/.tauri/jianlu-key-pass.txt（仓库外，本地保存）。
      # ⚠️ 私钥或密码任一丢失 = 永远无法给已装用户发更新。
      # ⚠️ 私钥「全文内容」而非文件路径：路径会被当成 base64 解出
      #    "Invalid symbol 58"（Windows 盘符冒号）。
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      # 源码在 Codeup 私有库，本 GitHub 仓库只有 README / LICENSE / workflow。
      # 所以先 clone 到 demo/，后面所有构建步骤都显式指向它。
      - name: 检出私有库源码
        env:
          CODEUP_TOKEN: ${{ secrets.CODEUP_TOKEN }}
        # 用 pwsh 的 ${env:...} 取变量，而不是 ${{ }} 直接拼进命令行，
        # 避免 token 出现在进程命令行里。
        run: |
          git clone --depth 1 "https://oauth2:${env:CODEUP_TOKEN}@codeup.aliyun.com/zheniz0322/Rust/tauri/jianlu.git" demo
        shell: pwsh

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Windows 上 Tauri 走 MSVC 工具链
          targets: x86_64-pc-windows-msvc

      - name: 缓存 Rust 依赖（加速重复构建）
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'demo/src-tauri -> target'

      - name: 安装前端依赖
        # package-lock.json 已入库（私有库），npm ci 锁定版本，构建可复现。
        # postinstall 会执行 node scripts/copy-vditor.mjs，把 Vditor 运行时资源
        # 同步到 public/vendor，供打包后离线加载。
        working-directory: demo
        shell: bash
        run: npm ci

      # 构建 + 签名 + 发布，一步完成。
      #
      # 为什么必须用 tauri-action（而不是「自己 build + softprops/action-gh-release」）：
      # 应用内自动更新依赖 Release 里存在一份 latest.json（内含每个平台的下载直链
      # + minisign 签名），而 **latest.json 只有 tauri-action 会自动生成并上传**。
      # softprops/action-gh-release 只传你手动列出的文件，不会产出它 ——
      # 那样用户端 updater 拿到 404，表现为「永远提示已是最新版本」。
      #
      # 签名：env 里的 TAURI_SIGNING_PRIVATE_KEY 生效时，tauri-action 会生成
      # .exe.sig 并填进 latest.json。**该 secret 缺失不会报错，只是静默不签名** ——
      # 那样应用能装、但自动更新会因验签失败被拒。发版前务必确认两个 secret 都已配。
      - name: 构建、签名并发布到 GitHub Release
        uses: tauri-apps/tauri-action@v0
        with:
          # 工程在 demo/ 子目录下（src-tauri 与 package.json 都在那儿）
          projectPath: ./demo
          # tag 推送触发时 inputs.tag_name 为空，tauri-action 自动用被推送的 tag；
          # 手动触发时用它填的值。留空则跳过建 Release，只保留构建产物。
          tagName: ${{ inputs.tag_name }}
          skipRelease: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name == '' }}
          # __VERSION__ 会被替换为 tauri.conf.json 里的 version
          releaseName: 'JianLu v__VERSION__'
          releaseBody: |
            Windows 安装包（NSIS）：下载 `.exe` 双击安装。
            已装用户可在应用内「帮助 → 检查更新」直接更新。
          releaseDraft: true
          prerelease: false
          args: --bundles nsis

# ─────────────────────────────────────────────────────────────────────────
# 补充说明
#
# 【仓库分工】本 GitHub 仓库（zhenzi0322-microsoft/jianlu）是**发布仓**：
#   只有 README / LICENSE / workflow，源码在 Codeup 私有库。
#   私有库里的 .github/workflows/ 不会被 GitHub Actions 执行（它在 Codeup 上），
#   所以发版流水线维护在这里，不要在两边各放一份 —— 容易改错地方。
#
# 【Secrets 配置】本仓库 Settings → Secrets 需三个：
#     CODEUP_TOKEN                    # 读私有库源码的 token（阿里云 Codeup 个人访问令牌）
#     TAURI_SIGNING_PRIVATE_KEY       # minisign 私钥的**全文内容**
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD  # 私钥密码
#
# 【为什么不装 NSIS】Tauri 打 nsis bundle 时会自行拉取内置的 NSIS 工具。
#
# 【MSVC 链接器】windows-latest runner 预装了 Visual Studio Build Tools。
#   若报 link.exe 找不到，可在 Rust 步骤前加：- uses: ilammy/msvc-dev-cmd@v1
#
# 【产物路径】NSIS 安装包在 demo/src-tauri/target/release/bundle/nsis/*.exe
#
# 【Release 可见性】releaseDraft: true 表示 Release 建出来是草稿，需在 Releases 页面
#   手动点 publish 才对外可见；想 tag 推送即发布，把它改成 false。
#
# 【tag 命名】监听 v*（如 v0.2.2）。版本号要与 package.json / tauri.conf.json /
#   Cargo.toml 三处一致，否则 updater 拿 latest.json 里的 version 与本地版本
#   比较会得出错误结论。
# ─────────────────────────────────────────────────────────────────────────
